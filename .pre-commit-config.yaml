# .pre-commit-config.yaml
# Skill 1.4 — Quality Automation: Ruff + Prettier + pre-commit hooks
# Install with: pre-commit install

repos:
  # ── Python linting & formatting (Ruff) ────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        name: "Ruff lint (Python)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        types: [python]
      - id: ruff-format
        name: "Ruff format (Python)"
        types: [python]

  # ── JavaScript / HTML / CSS formatting (Prettier) ─────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "Prettier format (JS/HTML/CSS)"
        types_or: [javascript, html, css]
        args: ["--single-quote", "--tab-width", "4"]

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "Ensure files end with newline"
      - id: check-yaml
        name: "Validate YAML files"
      - id: check-json
        name: "Validate JSON files"
      - id: check-merge-conflict
        name: "Check for merge conflict markers"
      - id: detect-private-key
        name: "Detect private keys"
      - id: no-commit-to-branch
        name: "Block direct commits to main"
        args: ["--branch", "main"]
