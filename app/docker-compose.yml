services:
  ignite-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${IGNITE_API_PORT:-8000}:8000"
    env_file:
      - ${IGNITE_COMPOSE_ENV_FILE:-.env}
    environment:
      IGNITE_RUNTIME_MODE: server
      IGNITE_ENV: ${IGNITE_ENV:-development}
      IGNITE_API_KEY: ${IGNITE_API_KEY:-}
      IGNITE_DATA_DIR: /data
      IGNITE_OTEL_ENABLED: ${IGNITE_OTEL_ENABLED:-true}
      IGNITE_SESSION_TTL_SECONDS: ${IGNITE_SESSION_TTL_SECONDS:-7200}
      IGNITE_MAX_SESSIONS: ${IGNITE_MAX_SESSIONS:-50}
    volumes:
      - ignite_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  ignite_data:
