name: Contest checks

# Public Agent-a-thon snapshot — no ACR/ACA deploy (see .github/CONTEST-CI.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-unit:
    name: Ignite Chat — Ruff & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install ruff pytest pytest-mock
      - name: Ruff lint (isolation surface)
        run: |
          ruff check server/session_store.py backend/core/runtime_identity.py backend/integrations/office_extract.py
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/unit/ -q --tb=short

  foundry-tools:
    name: Foundry slice — offline tool tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline Foundry deps
        run: |
          python -m pip install --upgrade pip
          pip install "python-dotenv>=1.0.0"
      - name: Offline golden-set tool tests
        run: |
          python test_tools.py
          python test_brain.py
