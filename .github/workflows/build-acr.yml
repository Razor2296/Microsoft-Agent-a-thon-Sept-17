# Optional manual ACR push. Automatic image build runs on merge to main (deploy-aca.yml).
# Kept so Develop push / open PR do not add a third status check next to Ruff + Installer.
name: Build Ignite Chat image (PAYG ACR)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: igniteapisiuacr.azurecr.io
  IMAGE_NAME: ignitechat-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          {
            echo "### ACR push (manual)"
            echo "- \`${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- \`latest\` — deploy with **Deploy Ignite Chat ACA (PAYG)** on \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
