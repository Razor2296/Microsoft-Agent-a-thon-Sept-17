# main (after PR merge): build image + deploy ACA — same pattern as IgniteChat.
# Last step updates Container App to the newly pushed ACR image (device-code Azure login).
name: Deploy Ignite Chat ACA (PAYG)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Skip rebuild and deploy this ACR tag (empty = build :sha + :latest then deploy)"
        required: false
        default: ""

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: igniteapisiuacr.azurecr.io
  ACR_NAME: igniteapisiuacr
  IMAGE_NAME: ignitechat-api
  CONTAINER_APP_NAME: ignitechat-api
  RESOURCE_GROUP: IgniteAPI
  KEY_VAULT_NAME: kvignitechatsiu
  KEY_VAULT_URI: https://kvignitechatsiu.vault.azure.net/
  AZURE_SUBSCRIPTION_ID: 4a614b14-fa98-4088-b2ec-dd6e3cc593bd
  AZURE_TENANT_ID: 19b73b1f-8603-4b51-ac82-5b17f03d2820
  FOUNDRY_CHAT_ENDPOINT: https://foundryignitechatsiu-87996.openai.azure.com/openai/v1
  IGNITE_EXTRACTION_API_URL: https://ignite-api.orangefield-53e31d49.eastus2.azurecontainerapps.io
  DEVICE_LOGIN_URL: https://microsoft.com/devicelogin
  MFA_WAIT_SECONDS: "900"

jobs:
  deploy-aca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        run: |
          INPUT="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT" ]; then
            echo "tag=$INPUT" >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Same order as IgniteChat: ACR build/push, then device login, then ACA update ---

      - name: Login to ACR
        if: steps.image.outputs.skip_build != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.image.outputs.skip_build != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push image to ACR
        if: steps.image.outputs.skip_build != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Resolve Azure auth mode
        id: auth
        run: |
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "mode=sp-json" >> "$GITHUB_OUTPUT"
          else
            echo "mode=device" >> "$GITHUB_OUTPUT"
            echo "::notice title=Device login required::After ACR push, open the Azure login step log, copy the code, visit https://microsoft.com/devicelogin (up to ${MFA_WAIT_SECONDS}s)."
          fi

      - name: Azure login
        env:
          AZURE_AUTH_MODE: ${{ steps.auth.outputs.mode }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          DEVICE_LOGIN_URL: ${{ env.DEVICE_LOGIN_URL }}
          MFA_WAIT_SECONDS: ${{ env.MFA_WAIT_SECONDS }}
        run: |
          chmod +x scripts/ci/azure-login-gh.sh scripts/ci/deploy-ignitechat-aca.sh
          bash scripts/ci/azure-login-gh.sh

      # LAST step (like IgniteChat): point Container App at the new ACR image.
      - name: Update Container App from ACR image
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: bash scripts/ci/deploy-ignitechat-aca.sh

      - name: Summary
        run: |
          set -euo pipefail
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          FQDN=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          REV=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.latestRevisionName" -o tsv)
          {
            echo "### Deploy completado (Agent-a-thon → PAYG ACA)"
            echo "- Image: \`${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}\`"
            echo "- API: https://${FQDN}"
            echo "- Health: https://${FQDN}/health"
            echo "- Extraction: ${IGNITE_EXTRACTION_API_URL}"
            echo "- Revision: \`${REV}\`"
            echo "- Flow: build/push ACR → device login → update ACA (same as IgniteChat)"
          } >> "$GITHUB_STEP_SUMMARY"
