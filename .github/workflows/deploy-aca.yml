# main (after PR merge): build this repo → push ACR → deploy ACA.
# Same outcome as IgniteChat, but ACR auth uses Azure CLI after device-code login
# (this public contest repo may not have ACR_USERNAME / ACR_PASSWORD GitHub secrets).
name: Deploy Ignite Chat ACA (PAYG)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Skip rebuild and deploy this ACR tag (empty = build :sha + :latest then deploy)"
        required: false
        default: ""

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: igniteapisiuacr.azurecr.io
  ACR_NAME: igniteapisiuacr
  IMAGE_NAME: ignitechat-api
  CONTAINER_APP_NAME: ignitechat-api
  RESOURCE_GROUP: IgniteAPI
  KEY_VAULT_NAME: kvignitechatsiu
  KEY_VAULT_URI: https://kvignitechatsiu.vault.azure.net/
  AZURE_SUBSCRIPTION_ID: 4a614b14-fa98-4088-b2ec-dd6e3cc593bd
  AZURE_TENANT_ID: 19b73b1f-8603-4b51-ac82-5b17f03d2820
  FOUNDRY_CHAT_ENDPOINT: https://foundryignitechatsiu-87996.openai.azure.com/openai/v1
  IGNITE_EXTRACTION_API_URL: https://ignite-api.orangefield-53e31d49.eastus2.azurecontainerapps.io
  DEVICE_LOGIN_URL: https://microsoft.com/devicelogin
  MFA_WAIT_SECONDS: "900"

jobs:
  deploy-aca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        run: |
          INPUT="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT" ]; then
            echo "tag=$INPUT" >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      # Device code FIRST — unlocks az acr login / credential show without GitHub ACR secrets.
      - name: Resolve Azure auth mode
        id: auth
        run: |
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "mode=sp-json" >> "$GITHUB_OUTPUT"
          else
            echo "mode=device" >> "$GITHUB_OUTPUT"
            echo "::notice title=Device login required::Open the Azure login step log, copy the code, visit https://microsoft.com/devicelogin (up to ${MFA_WAIT_SECONDS}s). Then the job builds/pushes and updates ACA."
          fi

      - name: Azure login
        env:
          AZURE_AUTH_MODE: ${{ steps.auth.outputs.mode }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          DEVICE_LOGIN_URL: ${{ env.DEVICE_LOGIN_URL }}
          MFA_WAIT_SECONDS: ${{ env.MFA_WAIT_SECONDS }}
        run: |
          chmod +x scripts/ci/azure-login-gh.sh scripts/ci/deploy-ignitechat-aca.sh
          bash scripts/ci/azure-login-gh.sh

      - name: Resolve ACR admin credentials
        env:
          SECRET_USER: ${{ secrets.ACR_USERNAME }}
          SECRET_PASS: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_USER:-}" ] && [ -n "${SECRET_PASS:-}" ]; then
            echo "Using GitHub secrets ACR_USERNAME / ACR_PASSWORD"
            USER="${SECRET_USER}"
            PASS="${SECRET_PASS}"
          else
            echo "No GitHub ACR secrets — fetching admin credentials via Azure CLI (device session)"
            USER="$(az acr credential show --name "${ACR_NAME}" --query username -o tsv)"
            PASS="$(az acr credential show --name "${ACR_NAME}" --query "passwords[0].value" -o tsv)"
            if [ -z "${USER}" ] || [ -z "${PASS}" ]; then
              echo "::error::Could not read ACR credentials. Enable admin user on ${ACR_NAME} or set ACR_USERNAME/ACR_PASSWORD repo secrets."
              exit 1
            fi
          fi
          echo "::add-mask::${PASS}"
          {
            echo "ACR_USERNAME<<EOF"
            echo "${USER}"
            echo "EOF"
            echo "ACR_PASSWORD<<EOF"
            echo "${PASS}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Build & push image to ACR
        if: steps.image.outputs.skip_build != 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
          LATEST="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          docker build -t "${IMAGE}" -t "${LATEST}" -f app/Dockerfile app
          docker push "${IMAGE}"
          docker push "${LATEST}"
          echo "Pushed ${IMAGE} and ${LATEST}"

      - name: Deploy ignitechat-api (env + Key Vault refs)
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: bash scripts/ci/deploy-ignitechat-aca.sh

      - name: Summary
        run: |
          set -euo pipefail
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          FQDN=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          REV=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.latestRevisionName" -o tsv)
          {
            echo "### Deploy completado (Agent-a-thon → PAYG ACA)"
            echo "- Image: \`${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}\`"
            echo "- API: https://${FQDN}"
            echo "- Health: https://${FQDN}/health"
            echo "- Extraction: ${IGNITE_EXTRACTION_API_URL}"
            echo "- Revision: \`${REV}\`"
            echo "- Auth: device code → Azure CLI (ACR secrets optional)"
          } >> "$GITHUB_STEP_SUMMARY"
